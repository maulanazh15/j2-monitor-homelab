server {
    listen 8080;
    server_name j2-monitor.homelabchester.my.id monitor.local;

    root /data/data/com.termux/files/home/homelab/www;
    index index.html;

    access_log /data/data/com.termux/files/home/homelab/logs/monitor-access.log;
    error_log /data/data/com.termux/files/home/homelab/logs/monitor-error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }
}
